<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interview Coach">
<title>NZ Interview Coach</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="login">
  <div class="box">
    <h1>NZ Interview Coach</h1>
    <p>合い言葉を入力してください</p>
    <div id="loginError"></div>
    <input type="password" id="password" autocomplete="current-password" placeholder="合い言葉">
    <button class="btn" id="loginBtn" style="width:100%">開く</button>
    <p class="small" style="margin-top:18px" id="loginHint"></p>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1 id="tabTitle">面接練習</h1>
    <div class="spacer"></div>
    <span class="badge" id="jdBadge">定番セット</span>
  </header>

  <main>
    <!-- ============================================================ 練習 -->
    <section class="tab active" id="tab-practice">
      <div id="practiceSetup">
        <div class="card">
          <h2>今日の練習</h2>
          <label class="field">
            <span>質問セット</span>
            <select id="setSelect"></select>
          </label>
          <div class="chips" id="categoryChips"></div>
          <div class="row">
            <button class="btn grow" id="startRandom">ランダムに1問</button>
            <button class="btn ghost" id="browseQuestions">一覧から選ぶ</button>
          </div>
        </div>
        <div id="questionList" class="list"></div>
      </div>

      <div id="practiceActive" style="display:none">
        <div class="question-box">
          <span class="pill" id="activeCategory"></span>
          <div class="q-en" id="activeQuestion"></div>
          <div class="q-intent" id="activeIntent"></div>
        </div>

        <div class="card recorder" id="recorderCard">
          <div class="timer" id="timer">0:00</div>
          <div class="level"><div id="levelBar"></div></div>
          <p class="small muted" style="margin:14px 0 12px">
            目安は60〜120秒。3分で自動的に停止します。<br>
            録音中に画面が消えないよう自動で抑止しますが、他のアプリに切り替えると
            そこまでの内容で確定します。
          </p>
          <button class="rec-btn" id="recBtn">録音開始</button>
          <div class="mic-state off" id="micState"></div>
          <div class="row" style="justify-content:center;margin-top:18px">
            <button class="btn ghost sm" id="typeInstead">録音せず文字で答える</button>
            <button class="btn ghost sm" id="cancelPractice">やめる</button>
          </div>
          <div id="recError"></div>
        </div>

        <div class="card" id="typeCard" style="display:none">
          <h2>文字で回答する</h2>
          <textarea id="typedAnswer" placeholder="Type your answer in English..."></textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="submitTyped">添削してもらう</button>
            <button class="btn ghost" id="backToRec">録音に戻る</button>
          </div>
        </div>
      </div>

      <div id="practiceResult" style="display:none"></div>
    </section>

    <!-- ============================================================ 台本 -->
    <section class="tab" id="tab-script">
      <div class="card">
        <h2>台本の添削</h2>
        <p class="small muted" style="margin-top:-4px">
          用意した回答を貼り付けると、NZの面接で自然に響く言い回しに直し、言い換え候補を出します。
        </p>
        <label class="field">
          <span>この台本が答える質問</span>
          <input type="text" id="scriptQuestion" placeholder="Tell me about a time you turned an unhappy customer around.">
        </label>
        <label class="field">
          <span>応募先に合わせる（任意）</span>
          <select id="scriptJd"></select>
        </label>
        <label class="field">
          <span>あなたの台本（英語）</span>
          <textarea id="scriptBody" placeholder="Write or paste your prepared answer here..."></textarea>
        </label>
        <button class="btn" id="reviewScriptBtn">添削する</button>
      </div>
      <div id="scriptResult"></div>
      <div class="card">
        <h2>過去の添削</h2>
        <div id="scriptHistory" class="list"></div>
      </div>
    </section>

    <!-- ========================================================== 用語 -->
    <section class="tab" id="tab-library">
      <div class="card">
        <h2>表現・用語ライブラリ</h2>
        <input type="text" id="phraseSearch" placeholder="検索（英語でも日本語でも）">
        <div class="chips" id="phraseCats" style="margin-top:12px"></div>
        <button class="btn ghost sm" id="addPhraseBtn">自分で追加する</button>
      </div>
      <div id="phraseList" class="list"></div>
    </section>

    <!-- ========================================================== 記録 -->
    <section class="tab" id="tab-progress">
      <div id="statsBox"></div>
      <div class="card">
        <h2>練習の履歴</h2>
        <div id="historyList" class="list"></div>
      </div>
    </section>

    <!-- ========================================================== 求人 -->
    <section class="tab" id="tab-jd">
      <div class="card">
        <h2>応募先を登録する</h2>
        <p class="small muted" style="margin-top:-4px">
          求人票を貼り付けると、その求人専用の面接質問をAIが作ります。応募先が決まったらここから登録してください。
        </p>
        <label class="field"><span>会社名</span><input type="text" id="jdCompany" placeholder="例：Vero Insurance"></label>
        <label class="field"><span>職種名</span><input type="text" id="jdTitle" placeholder="例：Client Relationship Manager"></label>
        <label class="field"><span>求人票の本文</span><textarea id="jdText" placeholder="Paste the full job description here..." style="min-height:200px"></textarea></label>
        <button class="btn" id="createJd">質問を作る</button>
      </div>
      <div id="jdList" class="list"></div>
    </section>
  </main>

  <nav class="bottom">
    <button data-tab="practice" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
      練習
    </button>
    <button data-tab="script">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      台本
    </button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      用語
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      記録
    </button>
    <button data-tab="jd">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      求人
    </button>
  </nav>
</div>

<div id="modal"><div class="sheet" id="modalBody"></div></div>

<script src="/app.js"></script>
</body>
</html>
